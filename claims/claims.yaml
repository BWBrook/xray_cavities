# Claims ledger: the single source of evidence for the journal article, the
# two-page brief and the agent guide. Format and rules: claims/README.md.
# Check with: uv run python scripts/claims/check_claims.py
schema: 1
claims:
  - id: NAT-01
    status: supported
    statement: >-
      Current native binary-lobe 2.5pV divided by reconstructed cumulative
      signed net injector gas delivery spans 0.4518–0.4810 (C-HI),
      0.5827–0.9864 (C-LO), 0.4043–0.4306 (G-HI) and 0.5417–0.6818 (G-LO).
      These are matched-case, actual-age ratios at the selected outputs near
      10, 20, 30, 40 and 50 Myr; G-HI stops at 40 Myr on this selected surface.
      The primary time rule is trapezoidal and the native enthalpy convention
      remains 2.5pV.
    evidence:
      - {path: docs/science/assets/native_delivery_restatement_2026-11-21/primary_selected_ages.csv, commit: 58ce7e6}
      - {path: docs/science/assets/native_delivery_restatement_2026-11-21/verification.json, commit: 58ce7e6}
      - {path: docs/science/assets/production_injector_histories_2026-11-21/history_tables.zip, commit: 1b3de17}
      - {path: docs/science/assets/production_injector_histories_2026-11-21/verification.json, commit: 1b3de17}
      - {path: docs/science/assets/turn15_review_2026-11-11/budgets/C-HI/measurements.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/budgets/C-LO/measurements.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/budgets/G-HI/measurements.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/budgets/G-LO/measurements.csv, commit: 3e9646e}
      - {path: docs/science/q029_binary_native_refresh_2026-09-06.md, commit: 5e34fa3}
      - {path: docs/science/assets/native_delivery_review_2026-11-21/comparison.json, commit: e36bf6e}
      - {path: docs/science/assets/native_delivery_review_2026-11-21/threshold_and_lobe_state.csv, commit: e36bf6e}
      - {path: docs/science/assets/native_delivery_review_2026-11-21/incremental_ratios.csv, commit: e36bf6e}
      - {path: docs/science/assets/native_delivery_review_2026-11-21/tracer_closure_limits.csv, commit: e36bf6e}
    reproduce: .venv/bin/python scripts/science/restate_native_delivery.py
    test: >-
      Claude independently recomputed the 19 primary rows within all 228
      method and time-rule combinations from the pinned snapshot rates and
      lobe integrals. The largest relative difference was below 5e-16.
    caveats:
      - The previously supported label-normalized comparison is retained as a comparator, not renamed measured delivery. The exact-native-volume numerator gives 0.5249–0.5587 (C-HI), 0.6309–1.1075 (C-LO), 0.4682–0.4983 (G-HI) and 0.6147–0.7849 (G-LO); historical Q029 numerators differ by at most 0.0071%.
      - Gas delivery includes internal and kinetic energy plus pressure work, with signed stationary absorption; it excludes potential-energy transport and the already initialized nozzle content at t=0.
      - Saved-state reconstruction uses linear_snapshot_flags and trapezoidal integration. Missing intermediate solver states, startup and the unsaved terminal dip preclude an exact realised-delivery or closure claim.
      - The 4pV convention multiplies every proxy ratio by 1.6; it is not an independently calibrated correction.
      - Across all 228 selected case-age/method/quadrature rows, C-LO remains below unity (maximum 0.989571). These sensitivities do not bound unsaved-state error.
      - Current absolute pV is not a current-minus-initial storage term. Four deterministic cases do not supply a population calibration or production-boundary certification.
      - "Independent review (Claude, 21 November 2026): all 228 rows reproduce to 5e-16 from the snapshot-rate and turn-15 tables without the published script or its interval tables (scripts/science/review_native_delivery.py). Independence stops at those tables; the face-flux reconstruction and native integrals were not regenerated."
      - "The ratio depends on the tracer cut more than on any quadrature choice. For tr1 > 1e-3, 5e-3 and 1e-2 C-LO at 50 Myr gives 0.986, 0.847 and 0.765; at 30 Myr the four cases give 0.471/0.426/0.401 (C-HI), 0.871/0.774/0.717 (C-LO), 0.404/0.355/0.331 (G-HI) and 0.667/0.617/0.588 (G-LO)."
      - "Unity is not a bound on this ratio. After 20 Myr C-LO's enthalpy grows faster than its delivery: 1.05, 1.10 and 1.21 per unit delivered over 20-30, 30-40 and 40-50 Myr at tr1 > 1e-3, against 0.92-0.98 at 5e-3 and 0.82-0.85 at 1e-2. C-LO's lobe thermal energy is 0.95-1.05 of the initial thermal energy in the same cells, so its numerator is close to the undisturbed ambient pressure times a tracer-defined volume."
      - "Net delivery measures what the free grid received. Dividing by cone delivery alone changes the high-power ratios by 0.1% and lowers C-LO to 0.545-0.956 and G-LO to 0.530-0.677."
      - "Tagged-mass closure discriminates between the reconstructions. Over intervals 20-47 the primary method closes to 4e-4 of an interval's labelled mass or better in G-HI and to 1e-4 or better in the other three cases; first-order states miss by 5.6-6.2% in every one of those intervals, so their rows are not an uncertainty envelope. Startup closure sums to -0.126 (C-LO) and +0.038 (G-LO) of one interval's labelled mass and the terminal interval over-predicts by 0.035-0.036. Applied to energy at the same scale these move C-LO's 50-Myr ratio by about 0.3% and 0.1%, and its 10-Myr ratio by about 1.3%."
      - "The high-power ratios come from runs with a measured exterior energy deficit. Per 1-Myr interval after 5 Myr it is 6–10% of labelled input in G-HI and 4–23% in C-HI, where it grows with age and depends on the outer-boundary flux reconstruction (BND-13). The paired restarts identify the entropy update at 10–12 Myr (BND-14). Over the two Myr that differ, lobe enthalpy gain divided by net gas delivered rises from 41.7% to 51.1% in G-HI and from 50.8% to 63.4% in C-HI with the update disabled. Counting the shared first ten Myr gives differences of 1.57 and 2.10 percentage points at age 12 (NAT-12). Its effect on the quoted later ages remains unmeasured."
    depends_on: [NAT-05]

  - id: NAT-02
    status: supported
    statement: >-
      Cocoon enthalpy differs from the actual total-energy change of the
      current cocoon region, which spans 0.132–0.426 (C-HI), 0.425–0.571
      (G-HI), 0.013–0.298 (G-LO) and −0.160–0.137 (C-LO) of injected energy.
    evidence:
      - {path: docs/science/q029_binary_native_refresh_2026-09-06.md, commit: 5e34fa3}
    reproduce: uv run --locked python scripts/science/build_q029_power_refresh.py
    caveats:
      - Negative regional values reflect gravitational changes relative to the initial fields, not negative absolute energy.
      - C-LO regional values are exposed to the boundary inflow of BND-01/BND-02.
    depends_on: [NAT-05]

  - id: NAT-03
    status: provisional
    statement: >-
      The selected shock-processed ambient region gains 0.666–0.765 (C-HI),
      0.505–0.655 (G-HI) and 0.580–0.854 (G-LO) of injected energy. C-LO has
      one accepted estimate, 0.223 at 10 Myr; its later ages fail the
