      - {path: docs/science/assets/production_entropy_review_2026-11-23/milestone_and_decade_balances.csv, commit: d7cc075}
    reproduce: .venv/bin/python scripts/science/restate_native_delivery.py
    test: >-
      Claude reproduced the twelve matched 30-Myr ratios and four 20-Myr
      ambient shares from the pinned input tables. A total-energy ambient
      share would also require the measured regional mass change and a
