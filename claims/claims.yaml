    reproduce: See the emission-audit and compact-summary commands in docs/science/assets/turn15_review_2026-11-11/README.md.
    test: >-
      Collaboration adjudication of the distinct projected-brightness,
      reconstructed-solid filling and volume-recovery estimands, including
      bipolar pooling and binary-cell semantics, before adopting a method.
    caveats:
      - Three side-on azimuths of one snapshot are not independent simulations or jet inclinations.
