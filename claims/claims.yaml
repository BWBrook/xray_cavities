  - id: BND-05
    status: provisional
    statement: >-
      Positive R100 stored-energy excess over labelled input agrees with the
      whole-grid excess minus the production-mass-scaled coarse boundary term
      within 0.002837 input units at all 11 eligible selected ages: C-HI and
      G-HI at 10/20/30 Myr, G-LO at 10/20/30/40/50 Myr. The excess ranges
      are 0.08339--0.09532, 0.07488--0.07943 and 0.13680--0.17825 respectively.
