      All 12 time-matched rows at three tracer thresholds reproduced.
    caveats:
      - The primary lobe contains all cells with jet tracer mass fraction greater than 0.001. The sign persists at the 0.005 and 0.01 thresholds.
      - The 11-Myr comparisons interpolate the OFF arm to the ON time across offsets below 400 years. Each 12-Myr endpoint is measured at exactly the same time.
