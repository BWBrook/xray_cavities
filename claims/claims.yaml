# Claims ledger: the single source of evidence for the journal article, the
# two-page brief and the agent guide. Format and rules: claims/README.md.
# Check with: uv run python scripts/claims/check_claims.py
schema: 1
claims:
  - id: NAT-01
    status: supported
    statement: >-
      With the true age known, native binary-cocoon enthalpy 2.5pV captures a
      substantial but case-dependent fraction of injected jet energy over
      10–50 Myr: 0.525–0.559 (C-HI), 0.468–0.498 (G-HI), 0.615–0.785 (G-LO)
      and 0.631–1.108 (C-LO).
    evidence:
      - {path: docs/science/q029_binary_native_refresh_2026-09-06.md, commit: 5e34fa3}
      - {path: docs/science/assets/q029_binary_native_refresh_2026-09-06/completion_acceptance.json, commit: 5e34fa3}
    reproduce: uv run --locked python scripts/science/build_q029_power_refresh.py
    caveats:
      - The 4pV convention multiplies every value by 1.6; it is not a universal correction.
      - The denominator is labelled kinetic power. If realised delivery exceeds it (BND-05, NAT-06), the fraction of delivered energy is lower by the same factor.
      - C-LO boundary exposure is bounded on the coarse controls: the boundary contrast beyond 50 kpc from the faces is at most 1e-4 E_inj,LO (BND-04). Production-grid confirmation is pending.
    depends_on: [NAT-05]

  - id: NAT-02
    status: supported
    statement: >-
      Cocoon enthalpy differs from the actual total-energy change of the
      current cocoon region, which spans 0.132–0.426 (C-HI), 0.425–0.571
      (G-HI), 0.013–0.298 (G-LO) and −0.160–0.137 (C-LO) of injected energy.
    evidence:
      - {path: docs/science/q029_binary_native_refresh_2026-09-06.md, commit: 5e34fa3}
    reproduce: uv run --locked python scripts/science/build_q029_power_refresh.py
    caveats:
      - Negative regional values reflect gravitational changes relative to the initial fields, not negative absolute energy.
      - C-LO regional values are exposed to the boundary inflow of BND-01/BND-02.
    depends_on: [NAT-05]

  - id: NAT-03
    status: provisional
    statement: >-
      The selected shock-processed ambient region gains 0.666–0.765 (C-HI),
      0.505–0.655 (G-HI) and 0.580–0.854 (G-LO) of injected energy. C-LO has
      one accepted estimate, 0.223 at 10 Myr; its later ages fail the
      bilateral shock gate.
    evidence:
      - {path: docs/science/q029_binary_native_refresh_2026-09-06.md, commit: 5e34fa3}
    reproduce: uv run --locked python scripts/science/build_q029_power_refresh.py
    caveats:
      - Includes thermal, kinetic and gravitational change; not all of it is irreversible heat.
      - Halving or doubling the mask thresholds changes C-LO/10 by factors of 0.654 and 1.588 and matters in G-LO.
    test: Cellwise no-jet counterfactual from the paired boundary controls (BND-02), plus measured face fluxes.

  - id: NAT-04
    status: supported
    statement: >-
      The cocoon/ambient energy decompositions close numerically against the
      independently summed retained energy change; the largest residual is
      2.30e-14 of injected energy, against a 1e-9 gate.
    evidence:
      - {path: docs/science/q029_binary_native_refresh_2026-09-06.md, commit: 5e34fa3}
    reproduce: uv run --locked python scripts/science/build_q029_power_refresh.py
    caveats:
      - Numerical closure only; physical closure against injection is BND-01.

  - id: NAT-05
    status: supported
    statement: >-
      The native cocoon is all cells with tracer tr1 > 1e-3 at full cell
      weight. This binary definition yields lobe volumes 3.8–6.1 times the
      fractional-tracer volumes at 10 Myr, so the choice of native truth
      materially changes any recovery ratio.
    evidence:
      - {path: docs/science/q029_binary_native_refresh_2026-09-06.md, commit: 5e34fa3}
    reproduce: uv run --locked python scripts/science/build_binary_native_refresh.py
    caveats:
      - A cell at tr1 = 1e-3 is 99.9% ambient gas by mass and emits near ambient level; tracer-defined cocoons are not X-ray cavities (XR-02).

  - id: NAT-06
    status: provisional
    statement: >-
      The first native spherical measurement, C-HI at actual age 0.999920251
      Myr, has R100/R300 of 10.737753/10.715145 kpc and total storage changes
      of 1.108722/1.108712 times labelled bipolar input. The whole native
      lobe has 2.5pV/input = 0.432392 and 4pV/input = 0.691827. Both spheres
      contain the entire traced cocoon, but slower disturbance exists outside.
    evidence:
      - {path: docs/science/assets/turn15_spherical_budgets_2026-11-05/smoke/C-HI/snapshot_0001.json, commit: c1f45e4}
      - {path: docs/science/assets/turn15_spherical_budgets_2026-11-05/smoke_review.json, commit: c1f45e4}
      - {path: docs/exchange/logs/2026-11-05-turn15-native-budgets-and-lineage.md, commit: c1f45e4}
    reproduce: >-
      uv run python scripts/science/summarize_spherical_energy_budgets.py
      --case C-HI --indices 1 --inputs
      docs/science/assets/turn15_spherical_budgets_2026-11-05/smoke/C-HI/snapshot_0001.json
      --output-dir <new summary directory>
    test: >-
      The four-case histories are now reviewed in NAT-07/NAT-08. Native
      delivery/transport measurements remain required before interpreting
      the excess as a physical or numerical closure failure.
    caveats:
      - This is one early snapshot; no complete history or four-case conclusion follows.
      - Labelled power is the denominator, not measured realised jet delivery.
      - Changing apertures and unmeasured surface transport preclude an energy-closure interpretation.
      - Native enthalpy is a separate global-lobe proxy, never an additive ledger term.
      - Independent review verified compact arithmetic and native-grid geometry, not a second extraction of the native energy fields.
      - Historical source-to-executable linkage remains qualified; exact input identities and external configuration checks are recorded separately.
    depends_on: [NAT-05, BND-05]

  - id: NAT-07
    status: provisional
    statement: >-
      In the verified four-case spherical histories, native whole-lobe 4pV
      divided by R100 same-cell total stored-energy change at about 30 Myr
      is 0.809, 1.289, 0.694 and 1.047 for C-HI, C-LO, G-HI and G-LO.
      Both apertures contain all current lobe cells and are geometrically
      complete at this age. At about 20 Myr, current ambient cells contribute
      72%, 98%, 54% and 82% of the signed R100 storage change respectively.
    evidence:
      - {path: docs/science/turn15_energy_emission_review_2026-11-11.md, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/energy/selected_ages.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/verification_summary.json, commit: 3e9646e}
    reproduce: See the archived independent arithmetic commands and rendering command in docs/science/assets/turn15_review_2026-11-11/README.md.
    test: >-
      Collaboration scientific adjudication of the component/proxy comparison,
      checking the same-cell reference, current-region masks and normalization;
      a different native estimand must not be substituted for the stated one.
    caveats:
      - Independent compact arithmetic and source/input identities pass; native HDF5 integrals were not independently regenerated.
      - Current pV is absolute; the ledger is current-minus-initial storage. Their ratio is not an injection efficiency.
      - Ambient shares are signed Eulerian current-region contributions, not Lagrangian deposition fractions.
      - Labelled power is not measured realised delivery, and geometric containment does not establish production boundary safety.
      - One deterministic realisation per case; G-HI retains only snapshots 0--47.
    depends_on: [NAT-05]

  - id: NAT-08
    status: provisional
    statement: >-
      At C-LO/50 Myr, complete R100/R300 apertures contain the entire current
      lobe but hold 1.232527/0.924874 labelled-input units of stored-energy
      change: the intervening ambient shell contributes 0.307653, about 25%
      of the R100 total. Current-cocoon change is -0.159984 while native
      whole-lobe 4pV is +1.771924. Later high-power apertures cross geometry
      limits: domain truncation starts at C-HI/44 and G-HI/40.
    evidence:
      - {path: docs/science/turn15_energy_emission_review_2026-11-11.md, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/energy/selected_ages.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/energy/case_flag_and_range_summary.csv, commit: 3e9646e}
    reproduce: See the energy-review command in docs/science/assets/turn15_review_2026-11-11/README.md.
    test: >-
      Collaboration adjudication of aperture and sign semantics against the
      independently checked components and flags; physical closure separately
      requires native delivery, transport and production-boundary measurements.
    caveats:
      - The negative current-cocoon change includes the fixed centre-zero potential and subtracts initial energy in current cocoon cells; it is not negative injected energy.
      - Disturbed ambient gas outside the apertures is detected, but its omitted energy and cause are unmeasured.
      - Candidate inset conflicts precede domain truncation; inset clipping can remove current lobe cells and is not adopted as a correction.
      - G-HI snapshots 48--50 are excluded; no extrapolation is made to them.
    depends_on: [NAT-05, NAT-07]

  - id: BND-01
    status: supported
    statement: >-
      Whole-grid energy change exceeds injected energy in all four cases:
      C-HI by 14–28%, G-HI by about 8%, G-LO by 23–58%, and C-LO by a factor
      of 6–24.
    evidence:
      - {path: docs/science/whole_grid_energy_closure_and_partition_2026-10-21.md, commit: a119b37}
    reproduce: uv run python scripts/science/build_whole_grid_energy_check.py
    caveats:
      - No tracer, shock or emission selection enters this test.

  - id: BND-02
    status: supported
    statement: >-
      Zero-gradient outflow boundaries on the stratified atmosphere drive
      jet-independent inflow through every face, growing as t², and that
      inflow carries enthalpy plus potential energy into the grid. In the
      paired uniform 1-kpc no-jet controls at 50 Myr, the outflow-minus-
      reflective contrast is 4.76e43 g and 7.01e59 erg in the cluster and
      2.29e42 g and 1.21e58 erg in the group, 0.93–0.98 of the prediction
      recorded beforehand, with growth exponents 1.97 and 1.93. Measured face
      transport explains the contrast to better than 1e-5. On the low-power
      scale this is 22.2 E_inj in the cluster and 0.385 E_inj in the group.
    evidence:
      - {path: docs/science/paired_nojet_boundary_prediction_2026-11-02.md, commit: e56b89f}
      - {path: docs/science/paired_boundary_results_2026-11-04.md, commit: f2f0f17}
      - {path: docs/science/assets/paired_boundary_comparison_2026-11-04/verdict.json, commit: f2f0f17}
    reproduce: >-
      uv run python scripts/science/compare_paired_boundary_prediction.py
      <bnd02_ledgers_2026-11-04_r1 capture> <new output directory>
    test: >-
      Frozen at e56b89f before the 50-Myr ledgers were read: refuted by a
      50-Myr mass contrast below 1e43 g (cluster) or 5e41 g (group), a
      growth exponent outside 1.6–2.4, or a two-sided H+P face-transport
      discrepancy above 10%. None occurred.
    caveats:
      - Coarse uniform-grid controls. Production uses a stretched grid; its own face transport is measured by the Q-031 flux job, not yet run.
      - The boundary term explains most but not all of the production excess (BND-05).
    depends_on: [BND-01, BND-03]

  - id: BND-03
    status: supported
    statement: >-
      The coarse (uniform 1 kpc) reflective no-jet cluster control is quiet
      at 50 Myr: total energy changes by 4.36e-9 of the initial whole-grid
      energy and peak Mach is 0.0022.
    evidence:
      - {path: docs/science/nojet_control_audit_2026-11-01.md, commit: db0e961}
    reproduce: uv run python scripts/science/audit_nojet_controls.py
    caveats:
      - Reflective boundaries and 1 kpc cells; production uses outflow boundaries and a stretched grid.
      - Quiet in the signed total only. The cellwise absolute (L1) change is 2.65% of the low-power scale 2e43 erg/s × 50 Myr over the whole grid, and 1.47% inside a 50-kpc face cut (BND-04).

  - id: BND-04
    status: provisional
    statement: >-
      In the paired coarse controls the boundary contrast is confined to the
      outer layers, but neither twin is quiet to 1% of the low-power scale
      S = 2e43 erg/s × t. At 50 Myr the cluster contrast first passes the
      0.01 S cellwise L1 bound between 40 and 50 kpc from the faces (1.24
      times the bound at 40 kpc), while both twins' own drift stays at about
      1.5 times the bound even at 50 kpc. No tested cluster cut is adopted.
      The group passes both tests from 20 kpc. The cellwise L1 also bounds any
      sub-volume: inside the 50-kpc cut, which contains any sphere of radius
      up to 150 kpc, the boundary contrast is at most 1e-4 S and each twin's
      drift at most 0.015 S (cluster); inside the 20-kpc cut, at most 0.0028 S
      (group).
    evidence:
      - {path: docs/science/paired_boundary_interior_check_2026-11-03.md, commit: e56b89f}
      - {path: docs/science/paired_boundary_results_2026-11-04.md, commit: 6c33d1b}
      - {path: docs/science/assets/paired_boundary_interior_2026-11-04/full_decision.json, commit: 6c33d1b}
    reproduce: >-
      uv run python scripts/science/summarize_paired_boundary_interior.py
      <paired_interior_full_2026-11-04_r1 capture> full <new decision json>
    test: >-
      Promoted only by a measurement of drift on the production stretched
      grid; a production cut must pass the same combined L1 criterion.
    caveats:
      - Coarse uniform grid; the production stretched grid's drift is unmeasured.
      - The shared drift's cause is not identified.
      - The bounds are absolute; relative to high-power injection they are 100 times smaller.
    depends_on: [BND-02]

  - id: BND-05
    status: open
    statement: >-
      Subtracting the coarse boundary contrast (BND-02) from the production
      whole-grid excess (BND-01) leaves a positive residual, roughly constant
      as a fraction of injected energy: 0.05–0.10 (C-HI), 0.075–0.080 (G-HI),
      0.14–0.19 (G-LO) and 0.29–0.76 (C-LO, where the boundary term is 22
      E_inj and a 2% amplitude difference moves the residual by 0.45). Its
      source is not established. Candidates are realised nozzle delivery
      above the labelled power and jet-driven face transport; the Q-031 flux
      job measures both. The C-HI 1-Myr sphere (NAT-06), far from every face,
      already holds 1.109 times the labelled input, which points to the
      source side for C-HI.
    evidence:
      - {path: docs/science/production_boundary_residual_2026-11-04.md, commit: 8faba6b}
    reproduce: >-
      uv run python scripts/science/residual_after_boundary_contrast.py
      <new csv path>
    test: >-
      The Q-031 production flux job: realised nozzle delivery minus Q × t,
      and production face transport minus the coarse boundary term, must
      together account for the residual; any part neither explains stays an
      open closure discrepancy.
    caveats:
      - Residual ranges span unscaled and production-mass-scaled boundary terms.
      - Retained parent sources select DENSITY_LENGTH_SCALE, not the DENSITY_JET_POWER branch used in the original nozzle argument; labelled input is not proved realised delivery. The categorical nozzle exclusion is withdrawn pending native flux measurement.
      - In the length-scale branch, the analytic nozzle state delivers Q to within −0.4% to +0.3% in all four cases, so a realised excess would be numerical injection at the zone boundary, not prescribed state.
    depends_on: [BND-01, BND-02]

  - id: OBS-01
    status: refuted
    statement: >-
      The legacy fixed-area (1%) X-ray cavity selector recovers cavity volume
      and enthalpy well enough to compare the four cases.
    evidence:
      - {path: docs/science/xray_cavity_selection_issue_2026-10-21.md, commit: 262a6f9}
      - {path: docs/science/q032_synthetic_harness_2026-10-31.md, commit: c7cce6a}
      - {path: docs/science/q032_retained_method_ladder_interpretation_2026-11-01.md, commit: 9f0223d}
    reproduce: uv run python scripts/science/build_q032_synthetic_harness.py
    caveats:
      - >-
        Refuted three ways: it reports a cavity on 8/8 cavity-free synthetic
        sides; its recovery falls as true volume rises (0.17 at a = 20 kpc,
        0.003 at 90 kpc); and on the simulations it compresses the native
        power contrast of about 1.6 dex to 0.2–0.4 dex, with nine detections
        that do not overlap the cocoon at all.

  - id: OBS-02
    status: withdrawn
    statement: >-
      X-ray/native enthalpy recovery has medians 0.022 (C-HI), 0.494 (C-LO),
      0.006 (G-HI) and 0.093 (G-LO). The discrepancy lies mainly in recovered
      extent and topology rather than in ambient pressure, and the high-power
      deficits are present before any age error.
    evidence:
      - {path: docs/science/q029_binary_native_refresh_2026-09-06.md, commit: 5e34fa3}
    caveats:
      - Withdrawn because every number comes from the legacy selector (OBS-01). The question is open again until a detector passes (DET-01).
    depends_on: [OBS-01]

  - id: DET-01
    status: supported
    statement: >-
      No rung of the retained method ladder is adoptable as a production
      cavity detector: neither legacy 1%, seed-and-grow, nor radial-deficit
      thresholds at 5%, 10% or 20%. The failures fall into two classes:
      detection efficiency that depends on cocoon contrast, and segmentation
      (background merges, off-axis selection, aperture clipping).
    evidence:
      - {path: docs/science/q032_retained_method_ladder_interpretation_2026-11-01.md, commit: 9f0223d}
      - {path: docs/science/q032_synthetic_harness_2026-10-31.md, commit: c7cce6a}
    reproduce: >-
      uv run python scripts/science/summarise_q032_retained_ladder.py
      docs/science/assets/q032_retained_method_ladder_2026-10-31/results/method_ladder_rows.csv
      docs/science/assets/q032_retained_method_ladder_2026-10-31/interpretation
      --native-root docs/science/assets/q029_binary_native_refresh_2026-09-06/remote_analysis
    caveats:
      - G-HI at 50 Myr is excluded; no t=0 baseline was used yet.

  - id: DET-02
    status: supported
    statement: >-
      Agreement in cavity volume does not imply agreement in geometry. At the
      5% deficit rung C-HI recovers 1.08 of native volume, but tracer
      completeness is 0.36 and purity 0.70–0.77, so the two errors cancel.
    evidence:
      - {path: docs/science/q032_retained_method_ladder_interpretation_2026-11-01.md, commit: 9f0223d}
    reproduce: see DET-01
    depends_on: [DET-01]

  - id: DET-03
    status: supported
    statement: >-
      The 120 kpc analysis aperture is not neutral: it removes up to 43% of
      the late high-power cocoon (C-HI tracer area inside the aperture is
      0.92, 0.72 and 0.57 at 30, 40 and 50 Myr) from any method.
    evidence:
      - {path: docs/science/q032_retained_method_ladder_interpretation_2026-11-01.md, commit: 9f0223d}
    reproduce: see DET-01

  - id: DET-04
    status: supported
    statement: >-
      The projected-tracer revolution volume overestimates the native 3D lobe
      volume by a median factor of 1.09–1.18 per case, so it is a fair proxy
      reference for observer tests.
    evidence:
      - {path: docs/science/q032_retained_method_ladder_interpretation_2026-11-01.md, commit: 9f0223d}
    reproduce: see DET-01

  - id: XR-01
    status: supported
    statement: >-
      Above the 10 keV edge of the APEC table, the retained emissivity
      correction stays positive and smooth to 20 keV, where it is 1.87% below
      the clamped value. It peaks near 88.5 keV and crosses zero at 544.7 keV.
    evidence:
      - {path: docs/science/q031_emissivity_extrapolation_2026-10-31.md, commit: 7f99371}
    reproduce: see the Reproduction section of the evidence note
    caveats:
      - G-HI/20 regional correction-domain contributions and convention sensitivities are now quantified in XR-04; other cases/ages and physical correctness of the extrapolation remain unestablished.

  - id: XR-02
    status: open
    statement: >-
      Tracer-defined cocoons and X-ray-visible cavities are different objects.
      The native emission pilot will separate shell, cocoon and unshocked
      emission terms, giving an emission-defined native reference for
      detector tests.
    evidence:
      - {path: docs/science/q031_native_path_length_design_2026-10-31.md, commit: 7f99371}
    test: >-
      Establish an emission-defined native reference with validated physical
      region definitions and four-case detector tests. Original pilot 871717
      terminated without running; completed G-HI/20 job 876556 supplies the
      bounded C/moving-ambient/below-cut diagnostics of XR-03/XR-04, not a
      validated shock or unshocked-shell reference.
    depends_on: [NAT-05]

  - id: XR-03
    status: provisional
    statement: >-
      At G-HI/19.999614 Myr, the bipolar seed/grow reconstructed solids are
      94.34%, 97.03% and 95.63% binary-lobe cells by volume at side-on azimuths
      0/45/90 degrees, yet lobe cells supply only about 1.3% of full-sightline
      brightness within those masks. The 5%-deficit outlines recover
      3.981/1.019/1.089 times native lobe volume while their lobe volume
      shares are only 11.32%/40.37%/50.47%.
    evidence:
      - {path: docs/science/turn15_energy_emission_review_2026-11-11.md, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/key_comparisons.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/filling.csv, commit: 3e9646e}
    reproduce: See the emission-audit and compact-summary commands in docs/science/assets/turn15_review_2026-11-11/README.md.
    test: >-
      Collaboration adjudication of the distinct projected-brightness,
      reconstructed-solid filling and volume-recovery estimands, including
      bipolar pooling and binary-cell semantics, before adopting a method.
    caveats:
      - Three side-on azimuths of one snapshot are not independent simulations or jet inclinations.
      - Filling pools W+/W- numerators and denominators; it is neither their union nor a mean of fractions.
      - Full-cell tr1 > 1e-3 membership is not a microscopic pure-jet fraction.
      - Native numerator integrals are source-bound; compact pooling and map/table arithmetic were independently reproduced.
      - Both observer comparators remain diagnostic and unadopted.
    depends_on: [NAT-05]

  - id: XR-04
    status: provisional
    statement: >-
      For G-HI/20 retained bipolar masks at the 100-km/s partition, moving
      ambient brightening contributes -0.39 to -0.84 times observed deficit.
      Initial-emissivity replacement with background refitting gives projected
      completeness 0.75--0.82 and purity near one, whereas fixed-background
      seed/grow at 0 degrees has purity 0.421 and recovered volume 5.37 times
      native lobe volume. Correction-policy changes alter fixed-mask deficits
      by at most 0.04161% and observer volumes by at most 0.7196% across all rows.
    evidence:
      - {path: docs/science/turn15_energy_emission_review_2026-11-11.md, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/key_comparisons.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/correction_sensitivity.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/velocity_sensitivity.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/histogram_numerical_qualification.json, commit: 3e9646e}
    reproduce: See the emission-audit, histogram-roundoff and compact-summary commands in docs/science/assets/turn15_review_2026-11-11/README.md.
    test: >-
      Collaboration adjudication of signed deficit attribution and background
      sensitivity, followed separately by a frozen observer-method test if a
      new rule is proposed. No selection is retuned using tracer truth here.
    caveats:
      - Replacement uses initial same-cell emissivity, not an evolved no-jet counterfactual or causal shock-energy estimate.
      - The fitted-background-minus-initial term is a reference offset; a negative value is not gas brightening.
      - Nearly 89% of disturbed non-lobe volume is below 30 km/s; the below-cut complement is not physically static.
      - Correction agreement measures sensitivity, not physical correctness. Domain/sign, sky-coverage and projection qualifications remain recorded.
      - Newly selected diagnostic outlines have no newly integrated native filling values; no detector or generic scientific-qualification flag is promoted.
    depends_on: [XR-03]
