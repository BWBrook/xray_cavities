  - id: BND-08
    status: provisional
    statement: >-
      At approximately 30 Myr all 36 reconstructed cumulative balances
      outside the nozzle control volume are negative in C-HI and G-HI,
      while both signs occur in C-LO and G-LO. In G-LO the balance spans
      -0.034636 to +0.070915 labelled-input units at 50 Myr. All four cases
      have an inferred cumulative nozzle-control source above labelled input
      across the scenarios at their last available original-batch endpoints.
      At the G-HI endpoint the separate addendum recovers 24 combinations.
      Their outside-nozzle balances span -0.082400 to -0.061045 of the last
      interval's labelled input and -0.071364 to -0.028336 of cumulative input.
    evidence:
      - {path: docs/science/four_case_flux_histories_2026-11-18.md, commit: fc33494}
      - {path: docs/science/assets/four_case_flux_2026-11-18/scenario_histories.csv, commit: fc33494}
      - {path: docs/science/ghi_flux_endpoint_2026-11-19.md, commit: c74585e}
      - {path: docs/science/assets/ghi_flux_endpoint_2026-11-19/independent_final_scenarios.csv, commit: c74585e}
      - {path: docs/science/assets/nozzle_flux_calibration_2026-11-19/ghi_same_scenarios.csv, commit: 4d8a96a}
      - {path: docs/science/three_case_final_interval_2026-11-19.md, commit: fd7305c}
      - {path: docs/science/assets/three_case_final_interval_2026-11-19/matched_final_intervals.csv, commit: fd7305c}
      - {path: docs/science/outer_tracer_gravity_2026-11-19.md, commit: cbc9c88}
      - {path: docs/science/assets/outer_tracer_gravity_2026-11-19/potential_work_intervals.csv, commit: cbc9c88}
    reproduce: >-
      Restore the verified archive and run scripts/science/compare_flux_histories.py
      on the four source-balance tables specified in docs/science/four_case_flux_histories_2026-11-18.md.
      For the endpoint, run the integrator and independent audit specified in
      docs/science/ghi_flux_endpoint_2026-11-19.md.
    test: >-
      Use the known-field test (BND-09) and the independent marked-mass
      inventory (BND-10) to constrain the injector. A radial trend in
      cumulative energy alone cannot distinguish reconstruction error
      from energy exchange outside the injector. Solver-step energy fluxes,
      overwrite and source terms would directly test that attribution.
    caveats:
      - Inside and outside balances include signed storage and reconstructed transport in the fixed centre-zero potential, normalized by labelled bipolar kinetic power times active age.
      - Outside the padded G-HI nozzle at 29–30 Myr, potential storage and transport imply gravitational work of −2.13% to −2.08% of labelled input. The total-energy residual spans −7.57% to −5.60%. Gravitational work contributes to the gas energy budget and cancels against the change and transport of potential energy in the continuum total. Its contribution to numerical error remains unresolved.
      - The comparison uses three complete histories to 50 Myr and the verified G-HI prefix through index 46. The 30-Myr comparison has full original scenario coverage in all four cases.
      - Twelve G-HI endpoint combinations require the invalid linear face flux at index 47. The lobe reaches the domain boundary at this age.
      - Sign agreement and spread across these finite reconstructions quantify method sensitivity. Actual discrete solver delivery and separate repair, floor or gravity-update energies remain unresolved.
      - G-HI's inferred whole-grid source is 1.0778–1.0796 cumulative at 30, 40 and 46 Myr under all six face and time rules, and 1.0670–1.0694 in the final interval under the four available rules. The outside balance subtracts the reconstructed nozzle source. BND-09 finds that a known G-HI steady jet does not reproduce the production 13–15% nozzle excess. The physical sign of the outside balance remains unresolved.
      - Twelve outer-active trapezoid and right-rectangle combinations use the 47-Myr domain-face value. The twelve left-rectangle estimates use the 46-Myr face. Net six-face transport at 47 Myr is about 0.54% of labelled power. All 24 final interval increments lie within each scenario's own preceding ten-interval range. These checks do not quantify every effect of boundary contact.
      - At 49–50 Myr the whole-grid energy source falls by 0.05860–0.05866, 0.02318–0.02938 and 0.06183–0.06188 of labelled interval input in C-HI, C-LO and G-LO. The ideal kinetic shortfall from the prescribed dip exceeds the C-LO decline. A ratio of ideal shortfall to observed decline does not measure the causal share.
    depends_on: [BND-05, BND-06, BND-07, NAT-11]

