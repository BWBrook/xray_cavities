      - The analytic kinetic flux of the prescribed state is within 0.4% of the label. Its total flux also includes enthalpy and gravitational transport at the chosen surface (BND-09). Neither calculation establishes discrete overwrite or solver-step delivery.
      - The tagged-mass inventory exceeds the mass implied by the label in all four cases at 30 Myr (BND-10). This supplies independent evidence of excess marked mass and does not fix the energy transferred per gram.
      - NAT-10's C-LO fixed-box endpoint is 28.89% above labelled input; neither it nor BND-07 supplies a measured delivered-energy correction.
    depends_on: [BND-01, BND-02, BND-04, NAT-07]

