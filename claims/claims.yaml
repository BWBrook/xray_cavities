  - id: XR-03
    status: provisional
    statement: >-
      At G-HI/19.999614 Myr, the bipolar 5%-deficit outlines recover
      3.981/1.019/1.089 times native lobe volume at side-on azimuths 0/45/90
      degrees while their lobe volume shares are only 11.32%/40.37%/50.47%.
      Thus near-unity recovered volume at 45/90 degrees hides 59.63%/49.53%
      non-lobe material by volume. Seed/grow solids are 94.34%/97.03%/95.63%
      binary-lobe cells by volume at those azimuths.
    evidence:
      - {path: docs/science/assets/turn18_reconciliation_2026-11-11/emission_denominators.csv, commit: 06f9a2d}
      - {path: docs/science/turn15_energy_emission_review_2026-11-11.md, commit: 3e9646e}
