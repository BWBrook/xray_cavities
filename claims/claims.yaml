      - "The cumulative fractions spread a 2-Myr intervention over a 12-Myr denominator. From 10 to 12 Myr each arm's own enthalpy gain per unit of gas energy delivered is 0.417 with the update on and 0.511 with it off in G-HI, and 0.508 and 0.634 in C-HI. The between-arm enthalpy gain per interval of labelled input grew from 0.058 (10–11 Myr) to 0.154 (11–12 Myr) in G-HI and from 0.015 to 0.270 in C-HI. The response had not settled, so no rate can be carried to later ages."
      - "The whole-grid energy difference between arms holds at 0.082–0.085 (G-HI) and 0.038–0.046 (C-HI) of cumulative labelled input at every 0.1-Myr output, while its thermal and kinetic parts move by more than that total. In units of one Myr of labelled input, the C-HI kinetic difference is +0.044 at 11 Myr and −0.053 at 12 Myr, and C-HI lobe thermal energy at 12 Myr is higher by 0.171 against a total difference of 0.078. There is one pair per case and no replicate to show how fast two trajectories separate. The 3.56% and 4.25% are a measured contrast at one time, not an effect size or a correction."
