        sides; its recovery falls as true volume rises (0.17 at a = 20 kpc,
        0.003 at 90 kpc); and on the simulations it compresses the native
        power contrast of about 1.6 dex to 0.2–0.4 dex, with nine detections
        that do not overlap the cocoon at all.

  - id: OBS-02
    status: withdrawn
    statement: >-
      X-ray/native enthalpy recovery has medians 0.022 (C-HI), 0.494 (C-LO),
      0.006 (G-HI) and 0.093 (G-LO). The discrepancy lies mainly in recovered
      extent and topology rather than in ambient pressure, and the high-power
      deficits are present before any age error.
    evidence:
      - {path: docs/science/q029_binary_native_refresh_2026-09-06.md, commit: 5e34fa3}
    caveats:
      - Withdrawn because every number comes from the legacy selector (OBS-01). The question is open again until a detector passes (DET-01).
    depends_on: [OBS-01]

  - id: DET-01
    status: supported
    statement: >-
      No rung of the retained method ladder is adoptable as a production
      cavity detector: neither legacy 1%, seed-and-grow, nor radial-deficit
      thresholds at 5%, 10% or 20%. The failures fall into two classes:
      detection efficiency that depends on cocoon contrast, and segmentation
      (background merges, off-axis selection, aperture clipping).
    evidence:
      - {path: docs/science/q032_retained_method_ladder_interpretation_2026-11-01.md, commit: 9f0223d}
      - {path: docs/science/q032_synthetic_harness_2026-10-31.md, commit: c7cce6a}
    reproduce: >-
      uv run python scripts/science/summarise_q032_retained_ladder.py
      docs/science/assets/q032_retained_method_ladder_2026-10-31/results/method_ladder_rows.csv
      docs/science/assets/q032_retained_method_ladder_2026-10-31/interpretation
      --native-root docs/science/assets/q029_binary_native_refresh_2026-09-06/remote_analysis
    caveats:
      - G-HI at 50 Myr is excluded; no t=0 baseline was used yet.

  - id: DET-02
    status: supported
    statement: >-
      Agreement in cavity volume does not imply agreement in geometry. At the
      5% deficit rung C-HI recovers 1.08 of native volume, but tracer
      completeness is 0.36 and purity 0.70–0.77, so the two errors cancel.
    evidence:
      - {path: docs/science/q032_retained_method_ladder_interpretation_2026-11-01.md, commit: 9f0223d}
    reproduce: see DET-01
    depends_on: [DET-01]

  - id: DET-03
    status: supported
    statement: >-
      The 120 kpc analysis aperture is not neutral: it removes up to 43% of
      the late high-power cocoon (C-HI tracer area inside the aperture is
      0.92, 0.72 and 0.57 at 30, 40 and 50 Myr) from any method.
    evidence:
      - {path: docs/science/q032_retained_method_ladder_interpretation_2026-11-01.md, commit: 9f0223d}
    reproduce: see DET-01

  - id: DET-04
    status: supported
    statement: >-
      The projected-tracer revolution volume overestimates the native 3D lobe
      volume by a median factor of 1.09–1.18 per case, so it is a fair proxy
      reference for observer tests.
    evidence:
      - {path: docs/science/q032_retained_method_ladder_interpretation_2026-11-01.md, commit: 9f0223d}
    reproduce: see DET-01

  - id: XR-01
    status: supported
    statement: >-
      Above the 10 keV edge of the APEC table, the retained emissivity
      correction stays positive and smooth to 20 keV, where it is 1.87% below
      the clamped value. It peaks near 88.5 keV and crosses zero at 544.7 keV.
    evidence:
      - {path: docs/science/q031_emissivity_extrapolation_2026-10-31.md, commit: 7f99371}
    reproduce: see the Reproduction section of the evidence note
    caveats:
      - G-HI/20 regional correction-domain contributions and convention sensitivities are now quantified in XR-04; other cases/ages and physical correctness of the extrapolation remain unestablished.

  - id: XR-02
    status: open
    statement: >-
      Tracer-defined cocoons and X-ray-visible cavities are different objects.
      The native emission pilot will separate shell, cocoon and unshocked
      emission terms, giving an emission-defined native reference for
      detector tests.
    evidence:
      - {path: docs/science/q031_native_path_length_design_2026-10-31.md, commit: 7f99371}
    test: >-
      Establish an emission-defined native reference with validated physical
      region definitions and four-case detector tests. Original pilot 871717
      terminated without running; completed G-HI/20 job 876556 supplies the
      bounded C/moving-ambient/below-cut diagnostics of XR-03/XR-04, not a
      validated shock or unshocked-shell reference.
    depends_on: [NAT-05]

  - id: XR-03
    status: provisional
    statement: >-
      At G-HI/19.999614 Myr, the bipolar 5%-deficit outlines recover
      3.981/1.019/1.089 times native lobe volume at side-on azimuths 0/45/90
      degrees while their lobe volume shares are only 11.32%/40.37%/50.47%.
      Thus near-unity recovered volume at 45/90 degrees hides 59.63%/49.53%
      non-lobe material by volume. Seed/grow solids are 94.34%/97.03%/95.63%
      binary-lobe cells by volume at those azimuths.
    evidence:
      - {path: docs/science/assets/turn18_reconciliation_2026-11-11/emission_denominators.csv, commit: 06f9a2d}
      - {path: docs/science/turn15_energy_emission_review_2026-11-11.md, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/key_comparisons.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/filling.csv, commit: 3e9646e}
    reproduce: See the emission-audit and compact-summary commands in docs/science/assets/turn15_review_2026-11-11/README.md.
    test: >-
      Collaboration adjudication of the distinct projected-brightness,
      reconstructed-solid filling and volume-recovery estimands, including
      bipolar pooling and binary-cell semantics, before adopting a method.
    caveats:
      - Three side-on azimuths of one snapshot are not independent simulations or jet inclinations.
      - Filling pools W+/W- numerators and denominators; it is neither their union nor a mean of fractions.
      - Full-cell tr1 > 1e-3 membership is not a microscopic pure-jet fraction.
      - Native numerator integrals are source-bound; compact pooling and map/table arithmetic were independently reproduced.
      - Both observer comparators remain diagnostic and unadopted.
    depends_on: [NAT-05]

  - id: XR-04
    status: provisional
    statement: >-
      For G-HI/20 retained bipolar masks at the 100-km/s partition, moving
      ambient brightening cancels 37.39--43.57% of the lobe deficit; its
      magnitude is 38.94--83.59% of the net observed deficit.
      Initial-emissivity replacement with background refitting gives projected
      completeness 0.75--0.82 and purity near one, whereas fixed-background
      seed/grow at 0 degrees has purity 0.421 and recovered volume 5.37 times
      native lobe volume. Correction-policy changes alter fixed-mask deficits
      by at most 0.04161% and observer volumes by at most 0.7196% across all rows.
    evidence:
      - {path: docs/science/turn18_review_reconciliation_2026-11-11.md, commit: 06f9a2d}
      - {path: docs/science/assets/turn18_reconciliation_2026-11-11/emission_denominators.csv, commit: 06f9a2d}
      - {path: docs/science/turn15_energy_emission_review_2026-11-11.md, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/key_comparisons.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/correction_sensitivity.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/velocity_sensitivity.csv, commit: 3e9646e}
      - {path: docs/science/assets/turn15_review_2026-11-11/emission/histogram_numerical_qualification.json, commit: 3e9646e}
    reproduce: See the emission-audit, histogram-roundoff and compact-summary commands in docs/science/assets/turn15_review_2026-11-11/README.md.
    test: >-
      Collaboration adjudication of signed deficit attribution and background
      sensitivity, followed separately by a frozen observer-method test if a
      new rule is proposed. No selection is retuned using tracer truth here.
    caveats:
      - Replacement uses initial same-cell emissivity, not an evolved no-jet counterfactual or causal shock-energy estimate.
      - The favorable ambient-replaced refit arm uses native tracer/velocity truth; it is not an observer-available detector. Frozen protocol c352554 separates it from the existing observer-only comparator and awaits held-out evaluation.
      - The fitted-background-minus-initial term is a reference offset; a negative value is not gas brightening.
      - Nearly 89% of disturbed non-lobe volume is below 30 km/s; the below-cut complement is not physically static.
      - Correction agreement measures sensitivity, not physical correctness. Domain/sign, sky-coverage and projection qualifications remain recorded.
      - Newly selected diagnostic outlines have no newly integrated native filling values; no detector or generic scientific-qualification flag is promoted.
    depends_on: [XR-03]

  - id: XR-05
    status: provisional
    statement: >-
      At G-HI/19.999614 Myr the broad lateral 5%-deficit X-ray arcs extend
      beyond the currently compressing gas. Across three side-on azimuths,
      91.4–99.4% of the selected lateral area in each hemisphere has no
      qualifying compression along its sightline under the primary definition.
      At 0° the arc edges lie a length-weighted median 26.12 and 25.47 kpc
      outside the dominant front in the negative and positive hemispheres.
    evidence:
      - {path: docs/science/ghi20_compressive_front_comparison_2026-11-23.md, commit: c6fc259}
      - {path: docs/science/assets/compressive_front_observer_2026-11-23/front_contour_separations.csv, commit: c6fc259}
      - {path: docs/science/assets/compressive_front_observer_2026-11-23/front_sightline_overlap.csv, commit: c6fc259}
      - {path: docs/science/ghi20_compressive_front_contract_2026-11-23.md, commit: 8905180}
      - {path: scripts/science/review_compressive_front.py, commit: 505eaf2}
      - {path: docs/science/assets/compressive_front_review_2026-11-24/summary.json, commit: 505eaf2}
    reproduce: >-
      Restore the original three development images and the verified native
      projections. Run the compare_compressive_front.py command in
      docs/science/ghi20_compressive_front_comparison_2026-11-23.md.
    test: >-
      Patrick reviews the native front selection, projection and interpretation.
      Claude reviews the development-case comparison against the frozen criteria.
    caveats:
      - The front finder admits smooth acoustic compressions. The edges alone cannot establish a shock or attribute brightness to it.
      - At 45° and 90° small signed medians combine inward and outward offsets. Only 0.6–2.0% of arc length is within one native resolution element of the dominant projected edge there.
      - All three views come from one previously exposed simulation output.
      - "Claude, 24 November 2026: the six medians, the 91.4–99.4% range and the 25.2–26.2 kpc range across the four definitions reproduce from the published tables. The contract and the observer protocol are unchanged since commits 8905180 and 0190f5b, the selector's four threshold sets equal the contract's, and the selector file is unchanged since a75c601, committed before native job 883581 started. I did not rerun the native selection. The claim stays provisional until Patrick's review of it."
      - "Claude, 24 November 2026: the exterior 5%-deficit area has barely changed since time zero. Pooled over both hemispheres, its brightness is 0.017% (0°), 0.015% (45°) and 0.11% (90°) above its time-zero value, and no component changes by more than 0.2% of current brightness. The fitted radial background stands 5.7%, 8.0% and 8.5% above the time-zero value. The arcs arise in the background fit. The net brightness figure does not depend on the front definition."

  - id: XR-06
    status: provisional
    statement: >-
      In G-HI at 19.999614 Myr the ambient gas in the dominant compression
      front offsets 32.8–49.5% of the lobe emission deficit on sightlines
      missed by the original cavity finders, pooling both hemispheres per
      azimuth and method. In the 0° view, assigning those front cells their
      initial emissivity gives an inferred/native volume ratio of 4.11 with
      the original radial background and 1.08 after refitting the same image.
      The refitted outline covers 56.4% of the projected tracer lobe.
    evidence:
      - {path: docs/science/ghi20_compressive_front_comparison_2026-11-23.md, commit: eef1497}
      - {path: docs/science/assets/compressive_front_observer_2026-11-23/emission_regions.csv, commit: eef1497}
      - {path: docs/science/assets/compressive_front_observer_2026-11-23/replacement_recovery.csv, commit: eef1497}
      - {path: docs/science/assets/ghi20_compressive_front_native_2026-11-23/independent_map_closure.json, commit: eef1497}
      - {path: docs/science/assets/compressive_front_review_2026-11-24/pooled_emission_budget.csv, commit: 505eaf2}
      - {path: docs/science/assets/compressive_front_review_2026-11-24/exterior_arc_threshold_margin.csv, commit: 505eaf2}
    reproduce: >-
      Run the compare_compressive_front.py command in
      docs/science/ghi20_compressive_front_comparison_2026-11-23.md with the
      full native receipt. Sum the two side numerators and denominators in
      emission_regions.csv and replacement_recovery.csv before division.
    test: >-
      Independent review of the native front definition, per-region emission
      sums and fixed-background versus refitted-background comparison.
    caveats:
      - The emissivity replacement uses the same present-day cells at both epochs. It requires three-dimensional simulation data.
      - The inferred volume uses axial symmetry. Completeness measures projected area. Both geometries come from one exposed case and age.
      - "Claude, 24 November 2026: the pooled offsets and all replacement ratios reproduce. The 32.8–49.5% is the share of the compressing layer alone, whose volume-weighted width is 0.32 kpc. On the same missed sightlines the ambient gas outside the layer, summed along the whole sightline, brightens by 1.35–2.09 times the lobe deficit, so the layer supplies 18–20% of the ambient brightening and those sightlines are 12–24% brighter than at time zero. Over all lobe sightlines the ambient gain is 72–78% of the lobe deficit."
      - "Claude, 24 November 2026: the change from 4.11 to 1.08 is a threshold crossing. At 0° the exterior ring has an area-mean deficit of 5.35% against the 5% threshold, and at most 5.58% on the four sampled rows. The replacement leaves the ring's brightness unchanged and lowers the refitted background there by 0.64%. The same step gives 0.65 and 0.85 at 45° and 90°, so 1.08 is not a recovery of the lobe volume."
    depends_on: [XR-05]
