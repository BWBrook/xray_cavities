      - The primary estimate uses linear reconstructed states, the configured solver switch, outer active-cell values and trapezoidal time weights. G-HI's linearly extrapolated outer state at index 47 is invalid. Its endpoint supports the left rule for that boundary reconstruction.
      - The simulation applies gravity using stage-resolved numerical face mass fluxes. Both work estimates use saved states. The paired restarts identify the entropy contribution in all four cases at 10–12 Myr (BND-14 and BND-15). BND-16 reconstructs the net exterior residual at other ages. The individual solver contributions at those ages remain unresolved.
