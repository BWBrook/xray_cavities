      - {path: docs/science/assets/turn15_review_2026-11-11/budgets/C-HI/measurements.csv, commit: 0d6c879}
    reproduce: >-
      uv run python scripts/science/residual_after_boundary_contrast.py
      <new csv path>
    test: >-
      Use native mass/fixed-box storage and reconstructed nozzle/domain
      transport to localise the residual. The extended flux summary retains
      an unresolved outside-nozzle source/balance term. Exact historical
      gravity-update, floor and conversion-repair energies require retained
      runtime diagnostics or a separately authorised instrumented simulation.
      The 5 November early-sphere predictions passed for G-HI, were partial
      for G-LO and failed for C-LO. NAT-10 now measures C-LO's signed
      box-minus-R100 addition: it is negative at 1 Myr and does not rescue
      the early prediction. Energy beyond that box remains unmeasured by
      this aperture comparison. BND-07's full flux history does not locate
      the source because reconstruction/cadence sensitivity changes its sign.
    caveats:
      - Eligibility uses complete spheres inside the existing 40-kpc inset. C-HI/40 fails that inset and G-HI/40 is domain-truncated; neither enters the 11-point comparison.
      - Agreement is with the specified mass-scaled estimate or distance to its bracket, not both endpoints. Unscaled G-LO differs by up to 0.013896.
      - Both accounting routes share production fields, initial-state and potential conventions; agreement does not prove exact boundary additivity or production-grid quietness.
      - C-LO/50 has observed aperture storage excess 0.232527; calling it a delivered-energy lower bound assumes unmeasured omitted-energy signs and mass/transport accounting.
