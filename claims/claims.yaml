  - id: XR-04
    status: provisional
    statement: >-
      For G-HI/20 retained bipolar masks at the 100-km/s partition, moving
      ambient brightening cancels 37.39--43.57% of the lobe deficit; its
      magnitude is 38.94--83.59% of the net observed deficit.
      Initial-emissivity replacement with background refitting gives projected
      completeness 0.75--0.82 and purity near one, whereas fixed-background
      seed/grow at 0 degrees has purity 0.421 and recovered volume 5.37 times
      native lobe volume. Correction-policy changes alter fixed-mask deficits
      by at most 0.04161% and observer volumes by at most 0.7196% across all rows.
    evidence:
