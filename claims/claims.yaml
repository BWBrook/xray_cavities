    caveats:
      - The independent review used the archived native HDF5 integrals and snapshot rates as inputs. It checked the normalization and ratios from those tables.
      - Current pV is absolute and R100 storage is current-minus-initial in the current aperture. Their ratio is not an injection efficiency, and storage/delivery near unity does not establish physical closure.
      - Ambient shares are signed Eulerian current-region contributions, not Lagrangian deposition fractions.
      - Total stored change transforms by potential-zero shift times regional mass change; a common delivery denominator does not remove that gauge dependence. The old 54–98% total ambient-share headline remains retired.
      - 2.5pV is primary; the 4pV comparator multiplies the proxy ratio by 1.6.
      - The new denominator is cumulative signed reconstructed gas delivery, excluding potential transport. Its time-resolution limits are those of NAT-01; geometric containment does not establish production boundary safety.
      - One deterministic realisation per case; G-HI retains only snapshots 0–47.
      - "Independent review (Claude, 21 November 2026): the twelve 30-Myr ratios and the four 20-Myr ambient shares reproduce from the pinned tables (scripts/science/review_native_delivery.py). The sensitivities recorded under NAT-01 apply to the first ratio."
      - "R100 storage exceeds reconstructed gas delivery in C-LO by 3.8–11.1% of labelled input at the selected ages. The switch directly adds energy outside the injector in C-LO at 10–12 Myr (BND-15). At 50 Myr the excess is 10.98% in R100 and 16.61% in the fixed inset box, alongside a whole-exterior residual of +17.02% (BND-16). The aperture fluxes, late switch counter and no-jet hydrostatic drift on the production mesh are unmeasured. The 1.5% coarse-control result belongs to BND-04."
    depends_on: [NAT-05, NAT-01]

