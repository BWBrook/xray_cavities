  - id: NAT-07
    status: supported
    statement: >-
      At matched actual ages near 30 Myr, current whole-lobe 2.5pV divided
      by reconstructed cumulative net injector gas delivery is 0.4714,
      0.8714, 0.4043 and 0.6673 for C-HI, C-LO, G-HI and G-LO. R100 same-cell
      stored thermal-plus-kinetic-plus-fixed-potential change divided by that
      same delivery is 0.9326, 1.0821, 0.9322 and 1.0196. Their ratio retains
